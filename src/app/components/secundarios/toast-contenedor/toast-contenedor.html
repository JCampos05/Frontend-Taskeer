<div class="contenedor" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toastsActivos(); track toast.id) {
    <div
      class="toast"
      [class]="'toast--' + toast.tipo"
      [style.--i]="$count - 1 - $index"
      animate.leave="toast-salir"
      [attr.role]="toast.tipo === 'error' ? 'alert' : 'status'"
    >
      <span class="toast__icono">
        @switch (toast.tipo) {
          @case ('exito') {
            <app-svg-check />
          }
          @case ('error') {
            <app-svg-error />
          }
          @case ('advertencia') {
            <app-svg-advertencia />
          }
          @case ('info') {
            <app-svg-info />
          }
        }
      </span>

      <div class="toast__cuerpo">
        @if (toast.titulo) {
          <strong>{{ toast.titulo }}</strong>
        }
        <p>{{ toast.mensaje }}</p>

        @if (toast.accion) {
          <button
            type="button"
            class="toast__accion"
            (click)="ejecutarAccion(toast.id, toast.accion.onClick)"
          >
            {{ toast.accion.etiqueta }}
          </button>
        }
      </div>

      <button
        type="button"
        class="toast__cerrar"
        (click)="cerrar(toast.id)"
        aria-label="Cerrar notificación"
      >
        <app-svg-x />
      </button>
    </div>
  }
</div>
