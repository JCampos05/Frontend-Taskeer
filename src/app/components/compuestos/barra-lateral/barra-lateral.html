<div class="encabezado">
  <a routerLink="/app/inicio" class="marca">
    <span class="marca__completa">Taskeer</span>
    <span class="marca__inicial">T</span>
  </a>
  <button
    type="button"
    class="boton-colapso"
    (click)="alternarColapso()"
    [attr.aria-label]="colapsada() ? 'Expandir menú' : 'Colapsar menú'"
  >
    <app-svg-flecha-doble />
  </button>
</div>

<div class="cuerpo">
  <nav class="seccion" aria-label="Navegación de la app">
    <p class="seccion__titulo">Esenciales</p>
    <a routerLink="/app/inicio" routerLinkActive="activo" class="nav__item" title="Inicio" aria-label="Inicio">
      <span class="nav__icono"><app-svg-casa /></span>
      <span class="nav__texto">Inicio</span>
    </a>
    <a routerLink="/app/mi-dia" routerLinkActive="activo" class="nav__item" title="Mi día" aria-label="Mi día">
      <span class="nav__icono"><app-svg-estrella-llena /></span>
      <span class="nav__texto">Mi día</span>
    </a>
    <a
      routerLink="/app/workspaces"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav__item"
      title="Todos los workspaces"
      aria-label="Todos los workspaces"
    >
      <span class="nav__icono"><app-svg-carpetas /></span>
      <span class="nav__texto">Workspaces</span>
    </a>
  </nav>

  @if (workspaces().length > 0) {
    <nav class="seccion" aria-label="Tus workspaces">
      <p class="seccion__titulo">Tus workspaces</p>
      @for (workspace of workspaces(); track workspace.id) {
        <a
          [routerLink]="['/app/workspaces', workspace.id]"
          routerLinkActive="activo"
          class="nav__item"
          [title]="workspace.name"
          [attr.aria-label]="workspace.name"
        >
          <span class="nav__inicial">{{ workspace.name.charAt(0) }}</span>
          <span class="nav__texto">{{ workspace.name }}</span>
        </a>
      }
    </nav>
  }
</div>

<div class="pie">
  <app-chip-plan />
  <app-menu-perfil />

  <div class="pie__accesos">
    <button
      type="button"
      class="boton-icono"
      (click)="alternarTema()"
      [attr.aria-label]="themeService.temaActual() === 'DARK' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    >
      @if (themeService.temaActual() === 'DARK') {
        <app-svg-sol />
      } @else {
        <app-svg-luna />
      }
    </button>

    <app-panel-notificaciones />
  </div>
</div>
