<div class="contenedor">
  <div class="tarjeta">
    <div class="ilustracion">
      <ng-content select="[ilustracion]" />
    </div>

    @if (codigo()) {
      <p class="codigo">{{ codigo() }}</p>
    }

    <h1 class="titulo">{{ titulo() }}</h1>

    @if (descripcion()) {
      <p class="descripcion">{{ descripcion() }}</p>
    }

    <div class="acciones">
      <ng-content select="[acciones]" />
    </div>
  </div>
</div>
